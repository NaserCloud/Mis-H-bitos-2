 ['cayó','«cayó» es del verbo caer: con y.','calló','«calló» es del verbo callar (no habló): con ll.'],
 ['sabia','«sabia» es la que tiene sabiduría: con b.','savia','«savia» es el líquido de las plantas: con v.'],
 ['botar','«botar» es saltar (botar la pelota): con b.','votar','«votar» es dar un voto: con v.'],
 ['bello','«bello» significa bonito: con b.','vello','«vello» es el pelo fino del cuerpo: con v.'],
 ['grabar','«grabar» es registrar sonido o imágenes: con b.','gravar','«gravar» es poner impuestos: con v.'],
 ['hierba','«hierba» es el pasto: con b.','hierva','«hierva» es del verbo hervir (que hierva el agua): con v.'],
 ['rebelar','«rebelar» es sublevarse: con b.','revelar','«revelar» es descubrir o mostrar: con v.'],
 ['ves','«ves» es del verbo ver (tú ves): acaba en s.','vez','«vez» es una ocasión (una vez; plural veces): acaba en z.'],
 ['casar','«casar» es contraer matrimonio: con s.','cazar','«cazar» es perseguir animales: con z.'],
 ['coser','«coser» es unir con hilo y aguja: con s.','cocer','«cocer» es cocinar al fuego: con c.'],

 ['siento','«siento» viene de sentir: con s.','ciento','«ciento» es el número 100: con c.'],
 ['asar','«asar» es cocinar al horno o a la brasa: con s.','azar','«azar» es la casualidad: con z.'],
 ['ay','«ay» es una exclamación: con y.','hay','«hay» es del verbo haber: con h.']].forEach(([a,ta,b,tb])=>{HOMO[strip(a)+'|'+strip(b)]=ta;HOMO[strip(b)+'|'+strip(a)]=tb;});
const HABER=['he','has','ha','hemos','habeis','han','hay','habia','habias','habiamos','habiais','habian','hubo','hubiera','hubiese','habra','habria','haya','hayan','habido','haber'];

/* mayúsculas y diéresis */
R('may_ini','mayus','Después de un punto (o al empezar el texto) la primera palabra se escribe con mayúscula.',x=>x.cl===x.tl&&x.c!==x.t&&x.ss&&x.c[0]!==x.c[0].toLowerCase());
R('may_prop','mayus','Los nombres propios (personas, lugares, países, marcas) y las siglas se escriben con mayúscula: Julia, Madrid, España, ONU.',x=>x.cl===x.tl&&x.c!==x.t&&x.c[0]!==x.c[0].toLowerCase());
R('min','mayus','Los nombres comunes se escriben con minúscula aunque vayan en medio de la frase. Los días, los meses y las estaciones también: lunes, enero, primavera.',x=>x.cl===x.tl&&x.c!==x.t);
R('dier','tilde','La diéresis (ü) se pone en «gü» delante de e, i cuando la u tiene que sonar: pingüino, cigüeña, vergüenza, lingüística.',x=>x.cs===x.ts&&x.cl.includes('ü')!==x.tl.includes('ü'));
/* tildes */
R('diac','tilde',x=>diacLookup(x),x=>x.tildeCase&&!!diacLookup(x),{poolText:'Tilde diacrítica: algunos monosílabos llevan tilde para distinguirse de otra palabra igual (él/el, tú/tu, sí/si, más/mas).'});
R('hiato','tilde','Hiato: cuando la vocal débil (i, u) es la que suena fuerte y va junto a otra vocal, siempre lleva tilde: día, país, río, maíz, baúl.',x=>x.tildeCase&&hasTilde(x.cl)&&/[aeoáéó][íú]|[íú][aeoáéó]/.test(x.cl));
R('ag_con','tilde','Las palabras agudas (suenan más fuerte en la última sílaba) llevan tilde si terminan en -n, -s o vocal: canción, jamás, café.',x=>x.tildeCase&&hasTilde(x.cl)&&x.info.n>1&&x.info.fe===1);
R('ll_con','tilde','Las palabras llanas (suenan más fuerte en la penúltima sílaba) llevan tilde si NO terminan en -n, -s ni vocal: árbol, lápiz, fácil.',x=>x.tildeCase&&hasTilde(x.cl)&&x.info.fe===2);
R('esd','tilde','Las palabras esdrújulas y sobresdrújulas (fuerza en la antepenúltima sílaba o antes) llevan siempre tilde: teléfono, pájaro, música, cómpramelo.',x=>x.tildeCase&&hasTilde(x.cl)&&x.info.fe>=3);
R('mono','tilde','Los monosílabos (una sola sílaba) no llevan tilde: fue, dio, vio, fe, pan. Solo la llevan los que necesitan tilde diacrítica (él, tú, sí...).',x=>x.tildeCase&&!hasTilde(x.cl)&&x.info.n===1);
R('ag_sin','tilde','Las palabras agudas NO llevan tilde si terminan en consonante distinta de -n o -s: reloj, papel, ciudad, corazón sí (acaba en n).',x=>x.tildeCase&&!hasTilde(x.cl)&&x.info.fe===1);
R('ll_sin','tilde','Las palabras llanas NO llevan tilde si terminan en -n, -s o vocal: mesa, examen, lunes, tarde.',x=>x.tildeCase&&!hasTilde(x.cl)&&x.info.fe===2);
R('tilde_gen','tilde','Fíjate en qué sílaba suena más fuerte (la sílaba tónica) y aplica las reglas de la tilde: agudas, llanas y esdrújulas.',x=>x.tildeCase);
R('homo','otros',x=>HOMO[strip(x.cl)+'|'+x.ts],x=>!!HOMO[strip(x.cl)+'|'+x.ts],{noPool:true});
/* letras */
const H=(x,c)=>x.codes.includes(c);
const CI=(x,c)=>{const o=x.diffs.find(o=>(o.c+'>'+o.x)===c);return o?o.ci:-1;};
const cnt=(s,re)=>(s.match(re)||[]).length;
// h
R('h_hue','h','Las palabras que empiezan por hue-, hie-, hia-, hui- se escriben con h: hueso, hielo, hiato, huida.',x=>H(x,'h>')&&/^h(ue|ie|ia|ui)/.test(x.cs));
R('h_haber','h','Todas las formas del verbo haber se escriben con h: he, has, ha, hemos, han, hay, había, hubo, haya.',x=>H(x,'h>')&&HABER.includes(x.cs));
R('h_hum','h','Las palabras que empiezan por hum- + vocal llevan h: humo, humedad, humano, humilde.',x=>H(x,'h>')&&/^hum[aeiou]/.test(x.cs));
R('h_griego','h','Los prefijos de origen griego hidr-, hiper-, hipo-, homo-, hetero-, hemi-, hepta-, hexa-, helio- llevan h: hidrógeno, hipopótamo, hexágono.',x=>H(x,'h>')&&/^(hidr|hiper|hipo|hetero|homo|hepta|hexa|hemi|helio|hema|hemo)/.test(x.cs));
R('h_pref','h','Cuando un prefijo se une a una palabra con h, la h se mantiene: deshacer, inhumano, rehacer, prohibir, exhibir.',x=>H(x,'h>')&&/^(des|in|re|pro|ex|co|sobre|contra)h/.test(x.cs));
R('h_extra','h','Esta palabra no lleva h. La h solo se escribe en palabras que empiezan por hue-, hie-, hia-, hui-, en formas del verbo haber y en la familia de palabras que ya la tienen.',x=>H(x,'>h'));
R('h_gen','h','La h no suena, así que hay que memorizarla y fijarse en su familia de palabras: hacer → hecho, deshacer; hoja → deshojar; hora → ahora.',x=>H(x,'h>'));
// b / v
R('b_bibl','bv','Las palabras que empiezan por bibl- llevan b: biblioteca, Biblia, bibliografía.',x=>H(x,'b>v')&&/^bibl/.test(x.cs));
R('b_bien','bv','Las palabras que empiezan por bien- y bene- llevan b: bienvenido, bienestar, beneficio.',x=>H(x,'b>v')&&/^(bien|bene)/.test(x.cs)&&CI(x,'b>v')<=3);
R('b_aba','bv','El pretérito imperfecto de los verbos en -ar se escribe con b: cantaba, jugabas, bailábamos, estudiaban.',x=>{const m=/(aba|abas|abamos|abais|aban)$/.exec(x.cs);return H(x,'b>v')&&m&&CI(x,'b>v')>=m.index;});
R('b_iba','bv','El imperfecto del verbo ir se escribe siempre con b: iba, ibas, íbamos, iban.',x=>H(x,'b>v')&&/^(iba|ibas|ibamos|ibais|iban)$/.test(x.cs));
R('b_bilidad','bv','Las terminaciones -bilidad, -bundo y -bunda se escriben con b: posibilidad, amabilidad, moribundo.',x=>H(x,'b>v')&&/(bilidad|bundo|bunda)$/.test(x.cs));
R('b_ble','bv','Las palabras terminadas en -ble se escriben con b: amable, posible, cable, hable.',x=>H(x,'b>v')&&/bles?$/.test(x.cs)&&CI(x,'b>v')>=x.cs.replace(/s$/,'').length-3);
R('b_bir','bv','Los verbos terminados en -bir se escriben con b: escribir, recibir, subir. Excepciones: hervir, servir, vivir.',x=>H(x,'b>v')&&/bir$/.test(x.cs));
R('b_ber','bv','Los verbos terminados en -ber se escriben con b: beber, caber, saber, deber, haber, sorber.',x=>H(x,'b>v')&&/ber$/.test(x.cs));
R('b_pref','bv','Los prefijos ab-, abs-, sub-, ob- se escriben con b: abstracto, subir, obtener, obvio.',x=>H(x,'b>v')&&/^(sub|obs|ob|abs|ab)/.test(x.cs)&&CI(x,'b>v')<=2);
R('b_bu','bv','Las palabras que empiezan por bu-, bus-, bur- se escriben con b: buscar, burro, bufanda, buzón.',x=>H(x,'b>v')&&/^bu/.test(x.cs)&&CI(x,'b>v')===0);
R('b_bi','bv','El prefijo bi-, bis-, biz- (dos, dos veces) se escribe con b: bicicleta, bisabuelo, bizcocho, bilingüe.',x=>H(x,'b>v')&&/^(bici|bisab|bisnie|bizco|bilin|bimens|bianu|bilat|bipe)/.test(x.cs)&&CI(x,'b>v')<=3);
R('b_lr','bv','Delante de l y r se escribe siempre b: blanco, brazo, hablar, libro, pobre.',x=>H(x,'b>v')&&'lr'.includes(x.cs[CI(x,'b>v')+1]||'#'));
R('b_mb','bv','Detrás de m se escribe siempre b: cambio, también, hombre, ambos.',x=>H(x,'b>v')&&x.cs[CI(x,'b>v')-1]==='m');
R('b_cons','bv','Delante de consonante y al final de palabra se escribe b: obtener, absurdo, club, obtuso.',x=>{const i=CI(x,'b>v');return H(x,'b>v')&&(i===x.cs.length-1||!'aeiou'.includes(x.cs[i+1]));});
R('b_gen','bv','Se escribe con b: no hay regla que lo explique, hay que memorizar la palabra y su familia (bueno → bondad, nube → nubarrón, lobo).',x=>H(x,'b>v'));
R('v_ev','bv','Las palabras que empiezan por ev- se escriben con v: evitar, evidente, evolución, evento.',x=>H(x,'v>b')&&/^ev/.test(x.cs)&&CI(x,'v>b')===1);
R('v_vice','bv','Vice- y viz- (en lugar de) se escriben con v: vicepresidente, vizconde.',x=>H(x,'v>b')&&/^vi(ce|z)/.test(x.cs)&&CI(x,'v>b')===0);
R('v_adv','bv','Detrás de d se escribe v: adverbio, advertir, adversario.',x=>H(x,'v>b')&&x.cs[CI(x,'v>b')-1]==='d');
R('v_nv','bv','Detrás de n se escribe siempre v: envío, invierno, conversación, convivir.',x=>H(x,'v>b')&&x.cs[CI(x,'v>b')-1]==='n');
R('v_uv','bv','Los pretéritos de andar, estar y tener (anduve, estuvo, tuvieron) y sus derivados (mantuvo, obtuvieron) se escriben con v.',x=>H(x,'v>b')&&/(anduv|estuv|tuv)/.test(x.cs));
R('v_ivo','bv','Los adjetivos terminados en -ave, -eve, -ivo, -iva, -avo, -eva, -evo se escriben con v: suave, breve, nuevo, activo, primitiva.',x=>H(x,'v>b')&&/(ave|eve|ive|avo|eva|evo|ivo|iva|avos|evos|ivos|ivas)$/.test(x.cs));
R('v_ver','bv','Los verbos terminados en -ver, -vir y -olver se escriben con v: ver, mover, llover, vivir, servir, volver. Ojo: beber, caber, saber, deber y haber llevan b.',x=>H(x,'v>b')&&/(ver|vir|olver)$/.test(x.cs));
R('v_gen','bv','Se escribe con v: hay que memorizar la palabra (vaca, vaso, huevo) o recordar su familia (nuevo → novedad, vivir → vida).',x=>H(x,'v>b'));
// g / j
R('gu_ei','gj','Para el sonido suave /g/ delante de e, i se escribe «gue», «gui» (guerra, guitarra, hormiguero): la u no suena. Si la u suena, se escribe «güe», «güi» (pingüino).',x=>H(x,'u>')&&/gu[ei]/.test(x.cs)&&x.cs[CI(x,'u>')-1]==='g');
R('g_sinu','gj','«ge» y «gi» suenan fuerte /j/ (gente, girar) y no llevan u. La u solo se pone para el sonido suave: guerra, guitarra.',x=>H(x,'>u')&&/g[ei]/.test(x.cs)&&/gu[ei]/.test(x.ts));
R('g_ger','gj','Los verbos terminados en -ger y -gir se escriben con g: coger, proteger, elegir, dirigir. Excepciones: tejer, crujir.',x=>H(x,'g>j')&&/g(er|ir)(se)?$/.test(x.cs));
R('g_gente','gj','Las palabras terminadas en -gente y -gencia se escriben con g: inteligente, urgente, urgencia.',x=>H(x,'g>j')&&/(gencia|gente)s?$/.test(x.cs));
R('g_geo','gj','Las palabras que empiezan por geo-, gen-, gest-, germ- se escriben con g: geografía, general, gente, gestión, germen.',x=>H(x,'g>j')&&/^(geo|gen|gest|germ|gel)/.test(x.cs)&&CI(x,'g>j')===0);
R('g_gia','gj','Las terminaciones -gia, -gio, -gión, -gico, -gional se escriben con g: magia, colegio, región, lógico, regional.',x=>H(x,'g>j')&&/(gia|gio|gion|gico|gica|gional)/.test(x.cs));
R('g_gen','gj','Las palabras terminadas en -gen se escriben con g: imagen, origen, virgen, margen.',x=>H(x,'g>j')&&/gen$/.test(x.cs));
R('g_ei','gj','Delante de e, i el sonido fuerte /j/ se escribe con g en muchas palabras: hay que memorizarlas (gente, girar, gigante, ligero, mágico).',x=>H(x,'g>j')&&'ei'.includes(x.cs[CI(x,'g>j')+1]||'#'));
R('g_aou','gj','El sonido suave /g/ delante de a, o, u se escribe g: gato, gota, gusano, amigo.',x=>H(x,'g>j')&&'aou'.includes(x.cs[CI(x,'g>j')+1]||'#'));
R('g_lr','gj','El sonido /g/ delante de l y r se escribe g: grande, globo, gris, regla.',x=>H(x,'g>j')&&'lr'.includes(x.cs[CI(x,'g>j')+1]||'#'));
R('j_aje','gj','Las palabras terminadas en -aje se escriben con j: viaje, garaje, mensaje, paisaje.',x=>H(x,'j>g')&&/ajes?$/.test(x.cs));
R('j_jero','gj','Las terminaciones -jero, -jera, -jería se escriben con j: extranjero, cajero, relojería, consejero.',x=>H(x,'j>g')&&/(jero|jera|jeria)s?$/.test(x.cs));
R('j_dijo','gj','Los pretéritos de decir, traer y de verbos como conducir o traducir se escriben con j: dijo, trajo, condujo, tradujeron.',x=>H(x,'j>g')&&/(dij|traj|duj)/.test(x.cs));
R('j_aou','gj','Con a, o, u el sonido fuerte /j/ se escribe j: jamón, joven, juego, rojo, viejo.',x=>H(x,'j>g')&&'aou'.includes(x.cs[CI(x,'j>g')+1]||'#'));
R('j_gen','gj','Se escribe j delante de e, i en muchas palabras: hay que memorizarlas (jefe, jirafa, ejemplo, mejilla) y mantener la j en su familia (viajar → viaje).',x=>H(x,'j>g'));
// ll / y
const llyC=x=>x.cs!==x.ts&&x.cs.replace(/ll|y/g,'#')===x.ts.replace(/ll|y/g,'#');
const corrLL=x=>cnt(x.cs,/ll/g)>cnt(x.ts,/ll/g);
R('ll_illo','lly','Las terminaciones -illo, -illa, -ello, -ella se escriben con ll: cuchillo, bocadillo, sello, estrella.',x=>llyC(x)&&corrLL(x)&&/(illo|illa|ello|ella)s?$/.test(x.cs));
R('ll_fam','lly','Las palabras de la familia de llamar, llegar, llevar, llorar, llover, llenar y llave se escriben con ll: lluvia, llegada, llevo.',x=>llyC(x)&&corrLL(x)&&/^(llam|lleg|llev|llor|llov|lluv|llen|llav)/.test(x.cs));
R('ll_gen','lly','Se escribe ll: hay que memorizar la palabra (calle, pollo, ballena, caballo) y fijarse en su familia (calle → callejón).',x=>llyC(x)&&corrLL(x));
R('y_fin','lly','La y al final de palabra, detrás de vocal, suena como i y se escribe con y: hay, voy, muy, rey, estoy.',x=>llyC(x)&&/y$/.test(x.cs));
R('y_pl','lly','El plural de las palabras acabadas en -y mantiene la y: rey → reyes, ley → leyes, buey → bueyes.',x=>llyC(x)&&/[aeiou]yes$/.test(x.cs));
R('y_verb','lly','Los verbos como leer, caer, oír, construir o huir cambian la i por y entre vocales: leyó, cayeron, oyendo, construyó, huyó.',x=>llyC(x)&&/[aeiou]y(o|eron|endo|era|eras|eran|ese|en|es|e)$/.test(x.cs));
R('y_gen','lly','Se escribe y: hay que memorizar la palabra (playa, ayuda, yogur, ayer, mayo) y fijarse en su familia (ayudar → ayuda).',x=>llyC(x));
// rr / r
const rrC=x=>x.cs!==x.ts&&x.cs.replace(/rr/g,'r')===x.ts.replace(/rr/g,'r');
R('rr_vv','rr','Entre vocales el sonido fuerte se escribe rr: perro, carro, tierra, correr.',x=>rrC(x)&&cnt(x.cs,/rr/g)>cnt(x.ts,/rr/g));
R('r_ini','rr','Al principio de palabra la r ya suena fuerte y se escribe con una sola r: ratón, rosa, rueda.',x=>rrC(x)&&x.cs[0]==='r');
R('r_nls','rr','Detrás de n, l, s el sonido fuerte se escribe con una sola r: Enrique, alrededor, Israel, honrado.',x=>rrC(x)&&/[nls]r/.test(x.cs));
R('r_gen','rr','Entre vocales, una sola r suena suave: pero, caro, mirar. Para el sonido fuerte se escribe rr: perro, carro.',x=>rrC(x));
// c / z / s / qu / k
R('qu','czs','El sonido /k/ delante de e, i se escribe «qu»: queso, quiero, aquí, quitar. La u no suena.',x=>/qu[ei]/.test(x.cs)&&!/qu[ei]/.test(x.ts));
R('c_ao','czs','El sonido /k/ delante de a, o, u y delante de l, r se escribe c: casa, cosa, cuna, clase, cruz.',x=>H(x,'c>q')||H(x,'c>k'));
R('k','czs','La k solo se usa en palabras de origen extranjero: kilo, kiwi, koala, ketchup, kárate.',x=>H(x,'k>c')||H(x,'k>q'));
R('cc','czs','Se escribe -cción (dos c) cuando la familia de palabras tiene ct: acto → acción, director → dirección, perfecto → perfección.',x=>/ccion/.test(x.cs)&&H(x,'c>'));
R('cion','czs','Se escribe -ción cuando la familia de palabras tiene t: canto → canción, atento → atención, nato → nación.',x=>/cion(es)?$/.test(x.cs)&&(H(x,'c>s')||H(x,'c>z')));
R('sion','czs','Se escribe -sión cuando la familia de palabras tiene s o d: confuso → confusión, decidir → decisión, expresivo → expresión.',x=>/sion(es)?$/.test(x.cs)&&(H(x,'s>c')||H(x,'s>z')));
R('z_anza','czs','Los sufijos -anza, -eza, -azo, -aza se escriben con z: esperanza, belleza, golpazo, tristeza.',x=>(H(x,'z>c')||H(x,'z>s'))&&/(anza|eza|azo|aza)s?$/.test(x.cs));
R('z_fin','czs','Las palabras acabadas en -z hacen el plural en -ces: luz → luces, lápiz → lápices, pez → peces.',x=>(H(x,'z>c')||H(x,'z>s'))&&/z$/.test(x.cs));
R('z_aou','czs','Delante de a, o, u el sonido /z/ se escribe z: zapato, zorro, azul, cabeza.',x=>(H(x,'z>c')||H(x,'z>s'))&&'aou'.includes(x.cs[Math.max(CI(x,'z>c'),CI(x,'z>s'))+1]||'#'));
R('z_gen','czs','Se escribe z: hay que memorizar la palabra (zeta, zigzag, zumo) y su familia (luz → luces).',x=>H(x,'z>c')||H(x,'z>s'));
R('c_ancia','czs','Las terminaciones -ancia y -encia se escriben con c: importancia, paciencia, ausencia, ciencia.',x=>(H(x,'c>s')||H(x,'c>z'))&&/(ancia|encia)s?$/.test(x.cs));
R('c_cer','czs','Los verbos terminados en -cer y -cir se escriben con c: hacer, nacer, decir, conocer. Excepciones: coser, toser, asir.',x=>(H(x,'c>s')||H(x,'c>z'))&&/c(er|ir)(se)?$/.test(x.cs));
R('c_cito','czs','Los diminutivos -cito, -cita, -cillo se escriben con c: corazoncito, florecita, pececillo.',x=>(H(x,'c>s')||H(x,'c>z'))&&/(cito|cita|cillo|cilla)s?$/.test(x.cs));
R('c_ei','czs','Delante de e, i el sonido /z/ se escribe casi siempre c: cero, cine, cielo, hacer, cebolla.',x=>(H(x,'c>s')||H(x,'c>z')));
R('s_oso','czs','Los adjetivos terminados en -oso, -osa se escriben con s: cariñoso, hermosa, peligroso.',x=>(H(x,'s>c')||H(x,'s>z'))&&/(oso|osa)s?$/.test(x.cs));
R('s_isimo','czs','Las terminaciones -ísimo, -ísima se escriben con s: grandísimo, muchísimo, guapísima.',x=>(H(x,'s>c')||H(x,'s>z'))&&/isim[oa]s?$/.test(x.cs));
R('s_esa','czs','Los femeninos en -esa, -isa se escriben con s: princesa, condesa, poetisa.',x=>(H(x,'s>c')||H(x,'s>z'))&&/(esa|isa)s?$/.test(x.cs));
R('s_gen','czs','Se escribe s: no hay una regla clara, hay que memorizar la palabra (casa, mesa, pasar) y su familia.',x=>H(x,'s>c')||H(x,'s>z'));

    case 'j_aje':case 'j_jero':case 'j_dijo':case 'j_aou':case 'j_gen':all('j');break;

    case 'cion':all('cion(es)?$');break;
    case 'sion':all('sion(es)?$');break;
    case 'z_anza':all('(anza|eza|azo|aza)s?$');break;

  const push=(id,sp)=>{if(sp&&sp.length)spans=spans.concat(sp);addRule(id,ruleTextById(id));};
  const tid=classifyTilde(wl);
  if(tid){const m=wOrig.match(/[áéíóúÁÉÍÓÚ]/);spans.push(m?[m.index,m.index+1]:[0,wOrig.length]);addRule(tid.id,tid.text||ruleTextById(tid.id));}
  if(wl.includes('ü')){const i=wl.indexOf('ü');spans.push([i,i+1]);addRule('dier',ruleTextById('dier'));}
  const hid=classifyH(wcs);if(hid)push(hid,ruleHighlightSpans(hid,wcs));
  const bid=classifyB(wcs);if(bid)push(bid,ruleHighlightSpans(bid,wcs));
  const vid=classifyV(wcs);if(vid)push(vid,ruleHighlightSpans(vid,wcs));
  const gid=classifyG(wcs);if(gid)push(gid,ruleHighlightSpans(gid,wcs));
  const jid=classifyJ(wcs);if(jid)push(jid,ruleHighlightSpans(jid,wcs));
  const llid=classifyLL(wcs);if(llid)push(llid,ruleHighlightSpans(llid,wcs));
  const yid=classifyY(wcs);if(yid)push(yid,ruleHighlightSpans(yid,wcs));
  const rrid=classifyRR(wcs);if(rrid)push(rrid,ruleHighlightSpans(rrid,wcs));

/* Intenta leer el detalle real del error que devuelve OpenAI (p.ej. "content_policy_violation" o
   "context_length_exceeded") en vez de quedarnos solo con el código HTTP -- así, si algo falla, el
   mensaje que ve David ya dice el motivo exacto y no hace falta ir a mirar los logs de Supabase. */
async function apiErrDetail(r){
  let msg='';
  try{const j=await r.json();msg=(j&&j.error&&(j.error.message||j.error.code||j.error.type))||(typeof j.error==='string'?j.error:'')||'';}catch(e){}
  const base=apiErr(r.status);
  return msg?base+': '+String(msg).slice(0,300):base;
}
const VISION_SYS='Eres un transcriptor literal de texto manuscrito (OCR). La imagen es la hoja de cuaderno de una niña de primaria que ha escrito un dictado y puede tener faltas de ortografía. Tu única tarea es copiar EXACTAMENTE lo que hay escrito, letra por letra, sin corregir NADA: no corrijas la ortografía, ni las tildes (si falta una tilde, no la pongas; si hay una tilde de más, déjala), ni las mayúsculas o minúsculas, ni los signos de puntuación, ni las palabras mal separadas o pegadas. Si una letra está equivocada, escríbela tal como está. Conserva los saltos de línea. Ignora los tachones y lo tachado. Si una palabra es totalmente ilegible, escribe [?] en su lugar. Incluye la fecha o el título si los ha escrito. Responde SOLO con el texto transcrito, sin comillas, sin comentarios y sin explicaciones.';
const useKey=()=>!!(state.ai.key&&state.ai.key.trim());
/* Modelos "clásicos" (gpt-4o / gpt-4o-mini): aceptan max_tokens y temperature libre. Los modelos
   nuevos de razonamiento (gpt-6.1-sol y similares) NO aceptan max_tokens (hay que mandar
   max_completion_tokens) ni una temperature distinta de la de por defecto -- mandar cualquiera de
   los dos da un error 400 de OpenAI ("Unsupported parameter"). El proxy de Supabase ya hace esta
   adaptación, pero cuando el usuario pone su propia clave de OpenAI (useKey()) nos saltamos el
   proxy y hablamos directo con la API, así que hay que adaptar el payload aquí también o el error
   reaparece en cuanto alguien use su propia clave. */
function adaptVisionBody(payload){
  if(!payload||typeof payload!=='object')return payload;
  const legacy=payload.model==='gpt-4o'||payload.model==='gpt-4o-mini';
  if(legacy)return payload;
  const b=Object.assign({},payload);
  if('max_tokens' in b){b.max_completion_tokens=b.max_tokens;delete b.max_tokens;}
  delete b.temperature;delete b.top_p;
  return b;
}
async function aiCall(kind,path,payload){
  if(useKey()){
    const body=kind==='vision'?adaptVisionBody(payload):payload;
    return fetch('https://api.openai.com'+path,{method:'POST',headers:{'Authorization':'Bearer '+state.ai.key.trim(),'Content-Type':'application/json'},body:JSON.stringify(body)});
  }
  return fetch(SB_URL+'/functions/v1/openai-proxy',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({kind,payload})});
}
async function readNotebook(dataUrl){
  const a=state.ai;

  let r;try{r=await aiCall('vision','/v1/chat/completions',body);}
  catch(e){throw new Error('Sin conexión con el servidor de voz');}
  if(!r.ok)throw new Error(await apiErrDetail(r));

  return t.replace(/^```[a-z]*\n?|```$/g,'').trim();
}
const PRINT_SYS='Eres un transcriptor fiel de texto (impreso o escrito) para crear dictados escolares en español. Copia EXACTAMENTE el texto de la imagen respetando ortografía, tildes, mayúsculas, signos de puntuación y saltos de párrafo. No resumas, no añadas, no corrijas, no traduzcas y no expliques nada. Ignora números de página, encabezados, pies de página, numeración y enunciados de ejercicios que no formen parte del texto. Si hay un título claro, escribe en la primera línea «TÍTULO: » seguido del título, deja una línea en blanco y continúa con el texto; si no hay título, empieza directamente por el texto. No uses markdown ni comillas para envolver el resultado. Si alguna palabra no se puede leer, escribe [?].';

/* El navegador ya aplica correctamente la orientación EXIF al decodificar el <img> (comprobado:
   createImageBitmap con imageOrientation:'none'/'from-image'/por defecto y el <img> normal dan
   siempre las mismas dimensiones ya corregidas). Por eso NO se hace ninguna corrección EXIF manual
   aquí -- intentarlo duplicaba la rotación y dejaba las fotos al revés. Nos fiamos del navegador
   para la orientación base y dejamos solo el giro manual (botón "Girar") para el usuario. */
async function jpegFromFile(file,max){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res({url:c.toDataURL('image/jpeg',0.85),w,h});
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('No se ha podido abrir la foto'));};
    img.src=url;
  });
}
async function fileToJpeg(file,max=1800){return (await jpegFromFile(file,max)).url;}
async function fileToJpegInfo(file,max=1800){return jpegFromFile(file,max);}
const Voz=(()=>{

  const map=new Map();let dbp=null;
  const db=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('deberesJulia',1);r.onupgradeneeded=()=>r.result.createObjectStore('audio');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));
  const idb=async(mode,fn)=>{const d=await db();return new Promise((res,rej)=>{const t=d.transaction('audio',mode),r=fn(t.objectStore('audio'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});};
  const K=t=>[AI_STYLE,state.ai.model,state.ai.voice,t].join('|');
  const ready=()=>!!state.ai.on;
  async function gen(text){
    const a=state.ai,body={model:a.model,voice:a.voice,input:text,response_format:'mp3'};
    if(/^gpt-4o/.test(a.model))body.instructions=AI_INSTR;
    let r;try{r=await aiCall('tts','/v1/audio/speech',body);}
    catch(e){throw new Error('Sin conexión con el servidor de voz');}
    if(!r.ok)throw new Error(await apiErrDetail(r));

  }
  async function missing(texts){const out=[];for(const t of [...new Set(texts)]){const v=await idb('readonly',s=>s.getKey(K(t))).catch(()=>undefined);if(v===undefined)out.push(t);}return out;}
  async function prepare(texts,onProg){
    const q=[...new Set(texts)];let done=0,fail=0,err='';
    const worker=async()=>{while(q.length){const t=q.shift();let ok=false;
      for(let n=0;n<2&&!ok;n++){try{const b=await gen(t);await idb('readwrite',s=>s.put(b,K(t)));ok=true;}catch(e){err=e.message;if(/clave|Límite|permiso/.test(err))break;}}
      if(ok)done++;else fail++;onProg&&onProg(done,fail);}};
    await Promise.all([worker(),worker(),worker()]);
    return{done,fail,err};
  }
  async function load(texts){
    map.forEach(u=>URL.revokeObjectURL(u));map.clear();
    for(const t of [...new Set(texts)]){const b=await idb('readonly',s=>s.get(K(t))).catch(()=>null);if(b)map.set(t,URL.createObjectURL(b));}
  }
  function unlock(){try{el.src=SILENT;const p=el.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
  function playUrl(url,speed,cb,fail){
    let fin=false,g;const end=()=>{if(fin)return;fin=true;clearTimeout(g);el.onended=el.onerror=null;cb();};
    const bad=()=>{if(fin)return;fin=true;clearTimeout(g);el.onended=el.onerror=null;fail();};
    el.onended=end;el.onerror=bad;el.src=url;el.defaultPlaybackRate=speed;el.playbackRate=speed;
    g=setTimeout(bad,30000);
    const p=el.play();if(p&&p.catch)p.catch(bad);
    return()=>{fin=true;clearTimeout(g);el.onended=el.onerror=null;try{el.pause();}catch(e){}};
  }
  return{ready,gen,missing,prepare,load,unlock,has:t=>map.has(t),play:(t,sp,cb,fail)=>playUrl(map.get(t),sp,cb,fail),playUrl,stop(){try{el.pause();}catch(e){}}};
})();

/* En vez de pedirle a la IA que "calcule" el ángulo de giro (poco fiable), le enseñamos la MISMA
   foto ya girada en las 4 orientaciones posibles y le pedimos que elija cuál se lee bien: para un
   modelo de visión, elegir entre 4 opciones es mucho más fiable que razonar un ángulo de memoria. */
const ROT_SYS='Vas a ver 4 imágenes numeradas del 1 al 4. Son la MISMA foto de una página de apuntes escolares, girada en 4 ángulos distintos. Solo UNA de las 4 tiene el texto de pie, en la orientación normal de lectura (se puede leer de corrido de izquierda a derecha sin ladear la cabeza ni el móvil). Mira con atención la orientación de las letras (no la del papel, la mesa o el fondo) y responde ÚNICAMENTE con una línea exacta: "CORRECTA: N" donde N es 1, 2, 3 o 4. No escribas nada más.';
async function detectPhotoRot(dataUrl){
  const angles=[0,90,180,270];
  let variants;
  try{variants=await Promise.all(angles.map(a=>rotateDataUrl(dataUrl,a)));}catch(e){return 0;}
  const content=[{type:'text',text:'¿Cuál de estas 4 imágenes (1, 2, 3 o 4, en ese orden) tiene el texto en la orientación correcta para leerlo normal?'}];
  variants.forEach((v,i)=>{content.push({type:'text',text:`Imagen ${i+1}:`});content.push({type:'image_url',image_url:{url:v,detail:'low'}});});
  let t;
  try{t=await aiText([{role:'system',content:ROT_SYS},{role:'user',content}],20);}catch(e){return 0;}
  const m=(t||'').match(/CORRECTA:\s*([1-4])/i);
  return m?angles[parseInt(m[1],10)-1]:0;
}
function genPrompt(exam,chunk,ci,nc,k){
  const mixed=exam.mode==='mixto',tt=exam.mode==='test'?'tipo test':exam.mode==='red'?'de respuesta redactada':`mixtas (${Math.ceil(k/2)} tipo test y ${Math.floor(k/2)} de respuesta redactada)`;

1) Cada pregunta evalúa UN dato distinto. Nunca dos preguntas con la misma respuesta ni reformulaciones de la misma idea. EXCEPCIÓN (ver regla 2): en preguntas de "aplica esta regla a un caso nuevo", repetir la MISMA pregunta-plantilla cambiando solo el caso concreto (una palabra, un verbo, un número...) SÍ cuenta como "dato distinto" y es exactamente lo que se pide, no una reformulación — que se parezcan mucho entre sí está bien y es lo esperado.
2) Los datos concretos (fechas, cifras, nombres, hechos) deben salir SOLO de los apuntes; no inventes datos externos. PERO si los apuntes explican una REGLA, MÉTODO o CLASIFICACIÓN general en vez de (o además de) datos concretos —por ejemplo: cómo separar la raíz y los morfemas de una palabra y qué significa cada uno, identificar sinónimos/antónimos, familias de palabras, clasificar palabras o frases en sus TIPOS (tipos de adverbios, de sustantivos, de pronombres, de oraciones, sujeto o predicado, etc.), conjugar un tiempo verbal, clasificar sílabas, etc.— entonces NO te limites al único ejemplo que aparezca en los apuntes: aplica esa MISMA regla o clasificación una y otra vez a casos NUEVOS y variados (palabras, frases, verbos, números…), reales y habituales para un alumno de 10-11 años (elígelos tú; no hace falta que estén en los apuntes). Este tipo de teoría se aprende por REPETICIÓN, así que genera TANTAS preguntas de este estilo como se te pidan, todas con la misma plantilla de pregunta y el mismo formato de respuesta, cambiando solo el caso concreto cada vez (nunca repitas el mismo caso dos veces); que muchos casos distintos acaben teniendo la MISMA respuesta final (p. ej. varias palabras que son todas "adverbio de tiempo") es NORMAL y no un problema. IMPORTANTE — no te salgas del alcance exacto de la teoría: solo varía dentro de las categorías, tiempos o tipos que los apuntes explican explícitamente, nunca añadas otros que el alumno no ha estudiado todavía. Por ejemplo, si los apuntes solo explican el presente y el futuro, todos los verbos deben practicarse en presente o futuro — NUNCA metas pretérito ni otro tiempo que no esté en los apuntes; si los apuntes solo explican tipos de adverbios de tiempo y lugar, no introduzcas otros tipos (de modo, cantidad…) que no se hayan visto. Si los apuntes SÍ cubren varias categorías (p. ej. verbos regulares e irregulares, o varios tipos de adverbio), entonces sí reparte las preguntas entre esas categorías para cubrirlas todas, pero sin salirte de lo que los apuntes cubren. Marca SIEMPRE el caso concreto en el campo "var" del JSON (ver formato abajo) además de mencionarlo en la pregunta — esto es obligatorio en cualquier pregunta de este tipo (clasificación incluida), p. ej.: "q":"Analiza la palabra «perrito»: ¿cuál es la raíz? ¿qué morfema(s) tiene y qué significa(n)?","var":"perrito"; "q":"Escribe el verbo «cantar» en futuro: ...","var":"cantar"; "q":"¿Qué tipo de adverbio es «ayer»?","var":"ayer".
3) Preguntas claras y autocontenidas, adecuadas a 10-11 años. Sin «según el texto». Sin verdadero/falso ni sí/no.
4) Test: 4 opciones plausibles y claramente distintas, solo una correcta, sin «todas las anteriores». La opción correcta no debe ser siempre la más larga.
5) Redactada: respuesta modelo de 1-2 frases y 2-5 palabras clave imprescindibles (una o dos palabras cada una). Elige como palabra clave SOLO el concepto central sin el cual la respuesta no tendría sentido (p. ej. "raíz", "futuro", "sustantivo"), NUNCA un sinónimo concreto, un detalle accesorio o una forma de decirlo muy literal — una niña de 10-11 años que responda bien pero con otras palabras o de forma más corta debe seguir acertando esa palabra clave. Si es una pregunta de "aplica la regla a un caso nuevo", la respuesta modelo debe dar el análisis completo de ese caso (p. ej. "Raíz: perr-. Morfemas: -it- (diminutivo), -o (género masculino)") y las palabras clave deben incluir cada parte del análisis, siempre eligiendo el concepto central de cada parte (p. ej. "perr" y "diminutivo", no la frase completa).

test: {"t":"test","q":"...","o":["...","...","...","..."],"c":0,"e":"explicación breve","fact":"dato evaluado en 3-6 palabras","var":"caso concreto si aplica la regla 2, si no, omite este campo"}
redactada: {"t":"red","q":"...","a":"respuesta modelo","k":["clave1","clave2"],"e":"","fact":"dato evaluado en 3-6 palabras","var":"caso concreto si aplica la regla 2, si no, omite este campo"}
En test, "c" es la posición (0-3) de la opción correcta dentro de "o".`},
   {role:'user',content:`APUNTES (trozo ${ci+1} de ${nc}):\n"""\n${chunk}\n"""\n\nGenera ${k} preguntas ${tt}.${exam.hint?`\nRecuerda seguir las indicaciones del profesor: ${exam.hint}`:''}${facts?`\nYa existen preguntas sobre estos datos; NO los repitas ni evalúes lo mismo: ${facts}`:''}`}];

async function genQuestions(exam,onProg){
  const chunks=exChunks(exam.notes);if(!chunks.length)throw new Error('Primero añade los apuntes');
  const target=Math.max(6,Math.min(80,exam.bank||40)),rng=seedRng('g'+Date.now());
  let calls=0,dry=0,err='';const maxCalls=Math.min(30,Math.ceil(target/3)+chunks.length*2);
  const start=exam.pool.length;
  while(exam.pool.length-start<target&&calls<maxCalls&&dry<3){
    const ci=calls%chunks.length;
    onProg&&onProg(`Generando preguntas… ${exam.pool.length-start} de ${target}`);
    let txt;try{txt=await aiText(genPrompt(exam,chunks[ci],ci,chunks.length,6),1500);}catch(e){err=e.message;break;}
    calls++;
    const fresh=exParse(txt).map(x=>exClean(x,ci,rng)).filter(Boolean).filter(q=>exam.mode==='mixto'||q.t===exam.mode);
    const {add,dropped}=exCurate(exam.pool,fresh);
    exam.pool=exam.pool.concat(add);exam.dropped=(exam.dropped||[]).concat(dropped).slice(-40);
    dry=add.length?0:dry+1;save();
  }
  return {added:exam.pool.length-start,calls,err};
}

  if(t.dataset.exq){const e=exGet(ui.exId);if(!e)return true;const q=e.pool[+t.dataset.i];if(!q)return true;const k=t.dataset.exq;

    save();return true;}
  return false;
}

/* Huella digital exacta del archivo (SHA-256 de sus bytes), para detectar por código -sin IA- si
   dos fotos subidas son literalmente el mismo archivo (la misma foto subida dos veces). */
async function fileHash(file){
  try{
    const buf=await file.arrayBuffer();
    const digest=await crypto.subtle.digest('SHA-256',buf);
    return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){return '';}
}
async function readNotesPhotos(files){
  const e=exGet(ui.exId),st=()=>$('#exSt');if(!e)return;
  if(!state.ai.photoOn){if(st())st().textContent='';return toast('Activa la IA de fotos en Ajustes para leer fotos');}
  const total=files.length;files=files.slice(0,EX_MAXPH);
  const gallery=state.examFotos[e.id]=(state.examFotos[e.id]||[]);
  const out=[];let okN=0,errN=0,dupN=0;
  const seenHashes=new Set(gallery.map(p=>p.hash).filter(Boolean));
  for(let i=0;i<files.length;i++){
    const hash=await fileHash(files[i]);
    if(hash&&seenHashes.has(hash)){dupN++;continue;}
    if(hash)seenHashes.add(hash);
    if(st())st().innerHTML=`🔎 Leyendo la foto ${i+1} de ${files.length}…`;
    const entry={id:uid(),thumb:'',full:'',text:'',err:'',rot:0,hash,name:files[i].name||''};
    try{
      const info=await fileToJpegInfo(files[i],1800),thumb=await fileToJpeg(files[i],260);
      entry.full=info.url;entry.thumb=thumb;
      const [rot,text]=await Promise.all([detectPhotoRot(entry.full).catch(()=>0),readNotesPhoto(entry.full)]);
      entry.rot=rot;entry.text=text;out.push(text);okN++;
    }catch(er){entry.err=er.message;errN++;}
    gallery.push(entry);
  }
  state.examFotos[e.id]=gallery.slice(-40);
  if(out.length){e.notes=(e.notes.trim()?e.notes.trim()+'\n\n':'')+out.join('\n\n');const ta=$('[data-exf=notes]');if(ta)ta.value=e.notes;}
  save();
  const y=scrollY;render();scrollTo(0,y);
  const s2=$('#exSt');
  if(s2){
    let msg=okN?`✅ <b>${okN} ${okN===1?'foto leída':'fotos leídas'}.</b> Revisa el texto por si la IA se ha equivocado y luego pulsa «Generar preguntas».`:'';
    if(dupN)msg+=(msg?' ':'')+`♻️ ${dupN} ${dupN===1?'foto estaba repetida (ya la tenías subida) y no se ha vuelto a contar':'fotos estaban repetidas (ya las tenías subidas) y no se han vuelto a contar'}.`;
    if(errN)msg+=(msg?' ':'')+`⚠️ ${errN} ${errN===1?'foto no se pudo leer':'fotos no se pudieron leer'} (toca su miniatura para ver el motivo).`;
    if(total>EX_MAXPH)msg+=` <br><small>Has subido ${total}; solo se procesan ${EX_MAXPH} de golpe. Sube el resto en otra tanda: se añadirá a lo que ya tienes.</small>`;
    if(!msg)msg='Esa foto ya estaba subida, no se ha vuelto a añadir.';
    s2.innerHTML=msg;
  }
}

function startExam(eid,itemId){
  const e=exGet(eid);if(!e||e.status!=='ready')return toast('Este examen todavía no está disponible');
  const n=Math.min(e.n,e.pool.filter(q=>!q.off).length),qs=exSample(e,'x'+Date.now()+eid,n);

}

    ${a.t==='red'?`<br><span class="mute">Palabras clave: ${a.hits.map(h=>'✔'+esc(h)).concat(a.miss.map(h=>'✘'+esc(h))).join(' ')} · nota automática ${Math.round(a.score*100)}%${a.ai?` · IA: ${Math.round(a.ai.score*100)}% — ${esc(a.ai.comment)}`:''}${a.man!==undefined?` · tu nota: ${Math.round(a.man*100)}%`:''}</span><br>
    <span class="row" style="gap:6px;margin-top:4px"><button class="btn" style="min-height:36px;padding:4px 12px" data-act="exAI" data-sid="${esc(s.id)}" data-rid="${esc(rid)}" data-qi="${i}">🤖 Corregir con IA</button>${[[1,'✅ Bien'],[0.5,'🟡 Regular'],[0,'❌ Mal']].map(([v,l])=>`<button class="btn" style="min-height:36px;padding:4px 12px" data-act="exMan" data-sid="${esc(s.id)}" data-rid="${esc(rid)}" data-qi="${i}" data-v="${v}">${l}</button>`).join('')}</span>`:''}</small></div>`;}).join('')}</details>`;
}
/* ================= temas de teoría: modo estudio (con/sin foto) ================= */
function ruleTextOfQ(q){
  const t=(q.e||'').trim();if(t)return t;
  const ans=q.t==='test'?q.o[q.c]:q.a;
  return (q.fact?q.fact+': ':'')+ans;
}
function shuffleArr(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
/* 3 opciones de "regla/explicación" para cuando Julia falla una pregunta: la correcta (de esta
   pregunta) y 2 señuelos sacados de otras preguntas del mismo tema. Igual que las 3 opciones del
   dictado, pero aplicado a las preguntas de teoría. */
function makeExamOptions(pool,q){
  const correct=ruleTextOfQ(q);
  const others=shuffleArr(pool.filter(o=>o.id!==q.id&&!o.off));
  const picks=[];
  for(const o of others){const t=ruleTextOfQ(o);if(t&&t!==correct&&!picks.some(p=>p.text===t)){picks.push({text:t,ok:false});}if(picks.length>=2)break;}
  return shuffleArr([{text:correct,ok:true},...picks]);
}
/* progreso de una ronda de estudio: se guarda el orden de preguntas (por id), en qué
   pregunta va y sus aciertos, para que si Julia sale (o cierra el navegador) a medias,
   al volver a abrir el mismo tema retome exactamente en la misma pregunta donde lo dejó. */
function studySave(){
  const st=ui.study;if(!st)return;
  state.studyProgress=state.studyProgress||{};
  state.studyProgress[st.temaId]={i:st.i,firstOk:st.firstOk,level:st.level,showPhoto:st.showPhoto,order:st.qs.map(q=>q.id)};
  save();
}
function studyClearProgress(temaId){
  if(state.studyProgress&&state.studyProgress[temaId]){delete state.studyProgress[temaId];save();}
}
/* ¿tiene este tema alguna foto de teoría (sin contar las que fallaron al subir)? decide si el
   texto transcrito empieza plegado (hay foto, se ve esa) o desplegado (no hay foto, hace falta
   el texto). Una vez decidido al abrir el tema, Julia puede plegar/desplegarlo a mano y eso se
   respeta el resto de la ronda (ver ui.study.theoryOpen). */
function studyHasPhotos(id){return (state.examFotos[id]||[]).some(p=>!p.err);}
function studyOpen(id){
  const e=exGet(id);if(!e||e.status!=='ready')return toast('Este tema todavía no está disponible');
  const pool=e.pool.filter(q=>!q.off);if(!pool.length)return toast('Este tema no tiene preguntas todavía');
  const saved=state.studyProgress&&state.studyProgress[id];
  let qs=null,i=0,firstOk=0,level=1,showPhoto=true;
  if(saved&&Array.isArray(saved.order)&&saved.i<saved.order.length){
    const byId={};pool.forEach(q=>byId[q.id]=q);
    const ordered=saved.order.map(qid=>byId[qid]).filter(Boolean);
    const extra=pool.filter(q=>!saved.order.includes(q.id));
    const rebuilt=ordered.concat(extra);
    if(rebuilt.length){qs=rebuilt;i=Math.min(saved.i,qs.length-1);firstOk=saved.firstOk||0;level=saved.level||1;showPhoto=saved.showPhoto!==undefined?saved.showPhoto:true;}
  }
  if(!qs)qs=shuffleArr(pool);
  ui.study={temaId:id,level,showPhoto,qs,i,stage:'answer',picked:null,given:'',opts:null,wrongPicks:[],firstOk,n:qs.length,recorded:false,theoryOpen:!studyHasPhotos(id)};
  ui.studyPhotoView=null;ui.studyQuitAsk=false;ui.screen='study';studySave();render();
}
function studyRound(temaId,level,showPhoto){
  const e=exGet(temaId),pool=e.pool.filter(q=>!q.off);
  ui.study={temaId,level,showPhoto,qs:shuffleArr(pool),i:0,stage:'answer',picked:null,given:'',opts:null,wrongPicks:[],firstOk:0,n:pool.length,recorded:false,theoryOpen:!studyHasPhotos(temaId)};
  ui.studyPhotoView=null;ui.studyQuitAsk=false;studySave();render();
}

function studyAnswerHTML(st,q){
  if(st.stage==='answer'){

      body=q.o.map((o,k)=>`<button class="item" style="display:block;width:100%;text-align:left;font:inherit;background:${st.picked===k?'#ece9fb':'#fff'};border:2px solid ${st.picked===k?'var(--pri)':'var(--line)'};border-radius:var(--r);padding:14px 16px;margin:8px 0;cursor:pointer;color:var(--ink)" data-act="studyPick" data-k="${k}"><b style="color:var(--pri2)">${'ABCDE'[k]}.</b> ${esc(o)}</button>`).join('');

    }

  }
  if(st.stage==='ok')return `<div class="msg right" style="font-size:1.1rem">✅ ¡Correcto!</div>${q.e?`<div class="mute" style="margin-top:6px">💡 ${esc(q.e)}</div>`:''}<div class="row" style="margin-top:12px"><button class="btn success big" data-act="studyNext">Siguiente ➜</button></div>`;
  if(st.stage==='rule'||st.stage==='ruleok'){
    const given=q.t==='test'?(st.picked!=null?q.o[st.picked]:'(sin contestar)'):(st.given||'(sin contestar)');
    const correct=q.t==='test'?q.o[q.c]:q.a;

  }
  return '';
}

/* ================= minijuegos: cada 15 preguntas, un descanso interactivo =================
   Se insertan al azar dentro de las tandas largas de ejercicios (mates, exámenes, estudio de
   temas) para que no se haga tan pesado. Seis juegos posibles, elegidos al azar cada vez. */
const MINI_WORDS=['jirafa','pelicano','bicicleta','manzana','estrella','planeta','cocodrilo','biblioteca','elefante','mariposa','castillo','tortuga','oceano','montana','cuaderno','ventana','sombrero','jardin','musica','pintura','camion','paraguas','delfin','tijeras','calendario','lampara','escalera','desierto','volcan','cometa'];
const MINI_EMOJIS=['🐶','🐱','🐵','🦁','🐸','🐧','🦋','🐢','🐬','🦖','🍎','🍉','⚽','🎈','🚗','🌈','⭐','🎵','🌙','☀️'];
const MINI_FACES=['🙂','😕','😟','😧','😨','😱'];
const MINI_KINDS=['memoria','ahorcado','tres','caza','puzzle','simon'];
const MINI_LABELS={memoria:'Memoria de parejas',ahorcado:'Ahorcado',tres:'Tres en raya',caza:'Caza la respuesta',puzzle:'Rompecabezas deslizante',simon:'Simón con colores'};
function miniGameDue(count,total){const ev=state.miniGameEvery||15;return count>0&&count%ev===0&&count<total;}
function miniClearTimer(g){if(g&&g.timer){clearInterval(g.timer);g.timer=null;}}
function startMiniGame(returnScreen,forceKind){
  const kind=forceKind||MINI_KINDS[Math.floor(Math.random()*MINI_KINDS.length)];
  const makers={memoria:makeMemoriaState,ahorcado:makeAhorcadoState,tres:makeTresState,caza:makeCazaState,puzzle:makePuzzleState,simon:makeSimonState};
  ui.mgame=Object.assign(makers[kind](),{kind,returnScreen});
  if(!ui.mgame.t0)ui.mgame.t0=Date.now();
  ui.screen='minigame';
  if(kind==='simon')simonNextRound(ui.mgame);else render();
}
/* ¿ha terminado la partida (con o sin premio)? memoria no guarda un "done" propio, se calcula
   mirando sus cartas; el resto sí tiene g.done (won/lost/draw/true/'timeout'). */
function miniIsDone(g){return g.kind==='memoria'?g.cards.every(c=>c.done):!!g.done;}
/* una frase corta con el resultado, para el historial de actividad del tutor */
function miniResultLine(g){
  switch(g.kind){
    case 'memoria':return `Completado en ${g.moves} movimientos`;
    case 'ahorcado':return g.done==='won'?`Acertó la palabra «${g.word}» (${g.fails} fallo${g.fails===1?'':'s'})`:`No acertó la palabra «${g.word}» (se quedó sin intentos)`;
    case 'tres':return g.done==='p'?'Ganó la partida':g.done==='draw'?'Empate':'Perdió la partida';
    case 'caza':return `${g.score} de ${g.total} aciertos`;
    case 'puzzle':return g.done===true?`Resuelto en ${g.moves} movimientos`:'No lo terminó a tiempo';
    case 'simon':return g.done==='won'?`Completó las ${g.maxRound} rondas`:`Llegó a la ronda ${g.round} de ${g.maxRound}`;
    default:return '';
  }
}
/* registra la partida terminada en la actividad del día (igual que dictados, mates, exámenes y
   teoría). Si Julia la salta con "Saltar este juego" sin terminarla, o es una prueba del tutor
   (miniPreview), no se registra nada. */
function recordMiniGame(g){

function makeTresState(){return {board:Array(9).fill(null),done:null};}
function ticWinner(b){
  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(const [a,b1,c] of L)if(b[a]&&b[a]===b[b1]&&b[a]===b[c])return b[a];
  return b.every(Boolean)?'draw':null;
}
function ticAIMove(b){
  const me='o',opp='p';
  const tryWin=mark=>{for(let i=0;i<9;i++){if(!b[i]){const t=b.slice();t[i]=mark;if(ticWinner(t)===mark)return i;}}return -1;};
  let m=tryWin(me);if(m<0)m=tryWin(opp);
  if(m<0&&!b[4])m=4;
  if(m<0){const corners=[0,2,6,8].filter(i=>!b[i]);if(corners.length)m=corners[Math.floor(Math.random()*corners.length)];}
  if(m<0){const free=b.map((v,i)=>v?null:i).filter(v=>v!==null);m=free[Math.floor(Math.random()*free.length)];}
  return m;
}

function puzzleNeighbors(i){
  const r=Math.floor(i/3),c=i%3,out=[];
  if(r>0)out.push(i-3);if(r<2)out.push(i+3);if(c>0)out.push(i-1);if(c<2)out.push(i+1);
  return out;
}
function puzzleSolved(t){for(let i=0;i<8;i++)if(t[i]!==i+1)return false;return t[8]===null;}
function makePuzzleState(){
  let tiles=[1,2,3,4,5,6,7,8,null],blank=8;
  for(let k=0;k<120;k++){
    const moves=puzzleNeighbors(blank),m=moves[Math.floor(Math.random()*moves.length)];
    [tiles[blank],tiles[m]]=[tiles[m],tiles[blank]];blank=m;
  }
  return {tiles,moves:0,done:puzzleSolved(tiles),t0:Date.now(),maxMoves:100,maxMs:4*60*1000,timer:null};
}

/* ================= análisis morfológico (con IA) =================
   Julia clasifica palabra por palabra el texto de un dictado (o cualquier otro texto que
   pegue) en su categoría gramatical (sustantivo, verbo, adjetivo...). La IA genera UNA VEZ,
   por adelantado, la "clave" correcta de cada palabra (usando el contexto de la frase, porque
   una misma palabra puede ser distinta categoría según dónde aparezca); luego el juego en sí
   es 100% local, palabra por palabra, con corrección inmediata. Nivel adaptado a 5º-6º de
   primaria: categorías generales, sin subtipos ni tiempos verbales. */
const MORFO_CATS=[
  {k:'sustantivo',l:'Sustantivo'},
  {k:'verbo',l:'Verbo'},
  {k:'adjetivo',l:'Adjetivo'},
  {k:'adverbio',l:'Adverbio'},
  {k:'articulo',l:'Artículo'},
  {k:'pronombre',l:'Pronombre'},
  {k:'preposicion',l:'Preposición'},
  {k:'conjuncion',l:'Conjunción'},
  {k:'otro',l:'Otra / no lo sé'}
];
const MORFO_LABEL=Object.fromEntries(MORFO_CATS.map(c=>[c.k,c.l]));
const MORFO_SET=new Set(MORFO_CATS.map(c=>c.k));
function morfoPrompt(text,tokens){
  const list=tokens.map((w,i)=>`${i}: "${w.t}"`).join('\n');
  return [{role:'system',content:`Eres un profesor de Lengua de primaria (Year 6, 10-11 años, colegio británico) que clasifica morfológicamente cada palabra de un texto en español. Para cada palabra de la lista, usando el contexto del texto completo, decide su categoría gramatical más apropiada para ese nivel (no distingas subtipos ni tiempos verbales: solo la categoría general). Usa EXCLUSIVAMENTE una de estas categorías (en minúsculas, tal cual, sin acentos): sustantivo, verbo, adjetivo, adverbio, articulo, pronombre, preposicion, conjuncion, otro (usa "otro" solo para números, interjecciones o palabras que de verdad no encajen en ninguna anterior). Devuelve SOLO un JSON válido: {"cats":["categoria0","categoria1",...]} con EXACTAMENTE ${tokens.length} elementos, en el mismo orden que la lista de palabras, uno por palabra — nunca añadas ni quites elementos.`},
   {role:'user',content:`TEXTO completo (para el contexto):\n"""\n${text}\n"""\n\nPALABRAS a clasificar, en este orden:\n${list}`}];
}
async function morfoAnalyze(text){
  const tokens=getWords(text).slice(0,220);
  if(!tokens.length)throw new Error('No hay palabras que analizar en este texto');
  const raw=await aiText(morfoPrompt(text,tokens),Math.min(2200,200+tokens.length*12));
  const m=raw.match(/\{[\s\S]*\}/);if(!m)throw new Error('La IA no ha devuelto una clasificación válida');
  let j;try{j=JSON.parse(m[0]);}catch(e){throw new Error('La IA no ha devuelto una clasificación válida');}
  if(!Array.isArray(j.cats))throw new Error('La IA no ha devuelto una clasificación válida');
  const cats=tokens.map((_,i)=>MORFO_SET.has(j.cats[i])?j.cats[i]:'otro');
  return {tokens,cats};
}
function morfoStart(text,title){
  ui.morfo={text,title:title||'Texto',tokens:[],cats:null,i:0,stage:'loading',results:[],ok:0,errMsg:''};
  ui.screen='morfo';render();
  morfoAnalyze(text).then(r=>{
    const st=ui.morfo;if(!st||st.stage!=='loading')return;
    st.tokens=r.tokens;st.cats=r.cats;st.stage='answer';render();
  }).catch(e=>{
    const st=ui.morfo;if(!st)return;st.stage='error';st.errMsg=e.message||'No se ha podido analizar el texto';render();
  });
}
function morfoFinish(){
  const st=ui.morfo;

  s.extra.push({id:uid(),kind:'morfo',title:'Análisis morfológico: '+st.title,start:Date.now(),end:Date.now(),secs:0,done:true,res:{n:st.tokens.length,ok:st.ok}});

}

}

/* ================= diccionario guiado inglés → español (con IA) =================
   Julia escribe CUALQUIER palabra en inglés que quiera consultar. La IA nunca traduce
   directamente: da una definición sencilla en inglés, un par de frases de ejemplo y algún
   sinónimo, todo en inglés, adaptado a su nivel (10-11 años, colegio británico). Con esas
   pistas, Julia intenta adivinar el significado en español, y solo al pulsar "Ver traducción"
   se le revela la traducción real para que ella misma compruebe si había acertado. */
function engDictPrompt(word){
  return [{role:'system',content:`Eres un profesor de inglés que ayuda a un alumno español de primaria (Year 6, 10-11 años, colegio británico) a adivinar el significado de una palabra en inglés SIN decírselo nunca. Te doy una palabra en inglés. Da pistas EN INGLÉS sencillo (adaptado a su nivel): una definición corta y fácil, 2 frases de ejemplo naturales usando la palabra, y hasta 2 sinónimos sencillos en inglés si existen. IMPORTANTE: en la definición, los ejemplos y los sinónimos NUNCA escribas la traducción al español de la palabra, ni la palabra en español, ni ninguna pista tan obvia que sea prácticamente decírselo (por ejemplo, no uses un cognado evidente si existe una forma de explicarlo sin él). Aparte, en un campo separado "translation" (que no se le mostrará al alumno hasta que él pida comprobar su respuesta), da la traducción correcta al español de esa palabra en este contexto. Devuelve SOLO un JSON válido: {"pos":"noun|verb|adjective|adverb|other","definition":"...","examples":["...","..."],"synonyms":["...","..."],"translation":"..."}. Si "${word}" no es una palabra real en inglés o no la reconoces, devuelve en su lugar SOLO {"error":"..."} con una frase breve en español explicando por qué.`},
   {role:'user',content:`Palabra: "${word}"`}];
}
async function engDictAnalyze(word){
  const raw=await aiText(engDictPrompt(word),700);
  const m=raw.match(/\{[\s\S]*\}/);if(!m)throw new Error('No he podido buscar esta palabra');
  let j;try{j=JSON.parse(m[0]);}catch(e){throw new Error('No he podido buscar esta palabra');}
  if(j.error)throw new Error(String(j.error).slice(0,200));
  if(!j.definition||!j.translation)throw new Error('No he podido buscar esta palabra');
  return {
    pos:String(j.pos||'').slice(0,20),
    definition:String(j.definition).slice(0,400),
    examples:(Array.isArray(j.examples)?j.examples:[]).map(x=>String(x).slice(0,200)).slice(0,3),
    synonyms:(Array.isArray(j.synonyms)?j.synonyms:[]).map(x=>String(x).slice(0,40)).slice(0,4),
    translation:String(j.translation).slice(0,120)
  };
}

  <div class="list">${H.map(h=>{const w=h.errs.filter(e=>e.type!=='extra').map(e=>e.type==='sub'?`${esc(e.typed)} → <b>${esc(e.correct)}</b>`:`falta <b>${esc(e.correct)}</b>`);
    return `<div class="panel"><b>${esc(h.title)}</b> <span class="mute">· ${fd(h.date)}${h.photo?' · 📷':''}</span><br>${h.total-h.wrong} de ${h.total} palabras bien (${pct(h)}%)${h.punct?` · ${h.punct} de puntuación`:''}${w.length?`<br><small>${w.join(' · ')}</small>`:''}</div>`;}).join('')}</div>
  <button class="btn danger" data-act="clearHist">Borrar historial</button>`;
}
function tabAjustes(){

  <label class="f" id="gapBox" style="${s.repeat>1?'':'display:none'}">Segundos entre repeticiones <span class="v" id="v_gap">${s.gap} s</span><input type="range" min="1" max="20" value="${s.gap}" data-set="gap"></label>
  <label class="f"><input type="checkbox" data-set="punct" ${s.punct?'checked':''}> Dictar los signos de puntuación</label><br>
  <label class="f"><input type="checkbox" data-set="showOrig" ${s.showOrig!==false?'checked':''}> Al corregir, permitir ver el texto original del dictado (Julia necesita el PIN de tutor)</label>
  <label class="f">Pausa después de cada signo<select data-set="ppause"><option value="0.6" ${s.ppause==0.6?'selected':''}>Corta</option><option value="1" ${s.ppause==1?'selected':''}>Normal</option><option value="1.6" ${s.ppause==1.6?'selected':''}>Larga</option><option value="2.2" ${s.ppause==2.2?'selected':''}>Muy larga</option></select></label>
  ${Dict.voices().length?`<label class="f">Voz<select data-set="voice">${Dict.voices().map(v=>`<option value="${esc(v.name)}" ${v.name===s.voice?'selected':''}>${v._q>=20?'⭐ ':''}${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select><button class="btn" style="margin-top:8px" data-act="testVoice">🔊 Probar voz</button></label>`:'<p class="mute">No se ha encontrado ninguna voz en español en este dispositivo.</p>'}</div>
  <p class="mute" style="margin-bottom:0">💡 <b>Para una voz más natural en el iPad:</b> Ajustes → Accesibilidad → Contenido hablado → Voces → Español, y descarga una voz «Premium» o «Mejorada» (por ejemplo Mónica, Paulina o Jorge). Luego elígela aquí (las de calidad alta aparecen con ⭐).</p></div>
  <div class="panel"><h3>🎙 IA de OpenAI: voz y lectura de fotos</h3>
  <p class="mute" style="margin-top:0">Usa la voz de OpenAI para dictar como una profesora. El audio se genera <b>una sola vez</b> al guardar cada dictado (cuesta unos céntimos) y queda guardado en este iPad. El audio queda guardado en cada dispositivo.</p>
  <label class="f"><input type="checkbox" data-ai="on" ${state.ai.on?'checked':''}> Usar voz IA (dictados)</label><br>
  <label class="f"><input type="checkbox" data-ai="photoOn" ${state.ai.photoOn?'checked':''}> Usar IA para leer fotos y generar preguntas</label><br>
  <p class="mute" style="margin:6px 0">Son dos interruptores independientes: puedes tener la voz IA apagada y la lectura de fotos encendida, o al revés.</p>
  <p class="mute" style="margin:6px 0">🔒 La clave de OpenAI está guardada en el servidor, no en este dispositivo.</p>
  <details><summary class="mute">Usar una clave propia solo en este dispositivo (opcional)</summary><label class="f">Clave API de OpenAI<input type="password" data-ai="key" value="${esc(state.ai.key)}" placeholder="sk-... (déjalo vacío para usar la del servidor)" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label></details>
  <div class="grid2" style="margin-top:12px">
   <label class="f">Voz<select data-ai="voice">${['coral','nova','shimmer','sage','ballad','alloy','ash','echo','fable','onyx','verse'].map(v=>`<option ${state.ai.voice===v?'selected':''}>${v}</option>`).join('')}</select></label>
   <label class="f">Modelo<select data-ai="model"><option value="gpt-4o-mini-tts" ${state.ai.model==='gpt-4o-mini-tts'?'selected':''}>gpt-4o-mini-tts (recomendado)</option><option value="tts-1-hd" ${state.ai.model==='tts-1-hd'?'selected':''}>tts-1-hd</option></select></label>
   <label class="f">Modelo para leer fotos del cuaderno<select data-ai="visionModel"><option value="gpt-4o" ${state.ai.visionModel==='gpt-4o'?'selected':''}>gpt-4o (mejor con letra a mano)</option><option value="gpt-4o-mini" ${state.ai.visionModel==='gpt-4o-mini'?'selected':''}>gpt-4o-mini (más barato)</option></select></label>
   <label class="f">Velocidad de la voz IA <span class="v" id="v_aispeed">${state.ai.speed}×</span><input type="range" min="0.7" max="1.2" step="0.05" value="${state.ai.speed}" data-ai="speed"></label></div>
  <div class="row" style="margin-top:12px"><button class="btn primary" data-act="testAI">🔊 Probar voz IA</button></div>
  <p class="mute" style="margin-bottom:0">Si cambias la voz, el modelo o el largo de las frases, hay que pulsar «Generar voz» en cada dictado (o se genera sola la primera vez que Julia lo empieza). Si falla algo, la app usa la voz del iPad.</p></div>
  <div class="panel"><h3>PIN</h3><button class="btn" data-act="changePin">Cambiar PIN</button></div>
  <div class="panel"><h3>🎮 Minijuegos</h3><p class="mute" style="margin-top:0">Cada cuántos ejercicios seguidos (mates, exámenes, estudio de temas) aparece un minijuego de descanso. También sale uno, siempre, justo después de corregir cada dictado.</p>
  <label class="f">Frecuencia <span class="v" id="v_miniGameEvery">cada ${state.miniGameEvery||15} ejercicios</span><input type="range" min="5" max="30" step="1" value="${state.miniGameEvery||15}" data-set2="miniGameEvery"></label>
  <p class="mute" style="margin:12px 0 6px">Prueba aquí cada juego, tal cual lo verá Julia:</p>
  <div class="row" style="flex-wrap:wrap;gap:8px">${MINI_KINDS.map(k=>`<button class="btn" data-act="miniPreview" data-kind="${k}">▶ ${MINI_LABELS[k]}</button>`).join('')}</div></div>
  <div class="panel"><h3>☁️ Sincronización</h3><p class="mute" style="margin-top:0">Los dictados, las reglas, los ajustes y el historial se guardan en el servidor y aparecen en todos los dispositivos (iPad, iPhone, ordenador). La voz elegida y la clave de OpenAI se quedan en cada dispositivo.</p><div id="cloudSt" style="margin:8px 0;font-weight:700">${Cloud.html()}</div><button class="btn" data-act="syncNow">🔄 Sincronizar ahora</button></div>
  <div class="panel"><h3>Copia de seguridad</h3><p class="mute" style="margin-top:0">Los datos se guardan en este iPad. Descarga una copia o pásala a otro dispositivo.</p><div class="row"><button class="btn" data-act="export">⬇️ Descargar copia</button><label class="btn" style="display:inline-flex;align-items:center">⬆️ Restaurar copia<input type="file" accept="application/json,.json" id="imp" hidden></label></div></div>`;
}
async function voiceMissing(d){return Voz.missing(voiceTexts(dictChunks(d)));}
async function refreshVoiceStatus(){
  for(const d of state.dictados){const el=document.querySelector(`[data-vs="${CSS.escape(d.id)}"]`);if(!el)continue;
    try{const m=await voiceMissing(d);el.textContent=m.length?`🎙 Faltan ${m.length} frases por generar`:'🎙 Voz lista';}catch(e){el.textContent='🎙 Voz no disponible';}}
}
async function genVoiceFor(id,explicit){
  const d=state.dictados.find(x=>x.id===id);if(!d||!Voz.ready())return;
  const el=()=>document.querySelector(`[data-vs="${CSS.escape(id)}"]`),say=m=>{const e=el();if(e)e.textContent=m;};
  const miss=await voiceMissing(d);
  if(!miss.length){say('🎙 Voz lista');if(explicit)toast('La voz de este dictado ya está lista');return;}
  say(`🎙 Generando 0 de ${miss.length}…`);
  const r=await Voz.prepare(miss,(ok,ko)=>say(`🎙 Generando ${ok+ko} de ${miss.length}…`));
  if(r.fail){say(`🎙 Faltan ${r.fail} frases`);toast(r.err||'No se pudo generar toda la voz');}else{say('🎙 Voz lista');toast('Voz generada ✔');}
}
const tutorActions={
  pinSet(){const a=$('#pin1').value,b=$('#pin2').value;if(!/^\d{4,8}$/.test(a))return toast('El PIN debe tener de 4 a 8 números');if(a!==b)return toast('Los PIN no coinciden');state.pin=a;save();ui.unlocked=true;render();},
  pinEnter(){if($('#pin1').value===state.pin){ui.unlocked=true;render();}else{toast('PIN incorrecto');$('#pin1').value='';}},
  lock(){ui.unlocked=false;ui.editId=null;render();},
  tab(b){ui.tab=b.dataset.t;ui.editId=null;render();},
  mode(b){state.rulesMode=b.dataset.m;save();render();toast(state.rulesMode==='test'?'Reglas en modo test':'Reglas en modo escribir');},
  newDict(){ui.editId='';render();},
  editDict(b){ui.editId=b.dataset.id;render();},
  cancelEdit(){ui.editId=null;render();},
  saveDict(){const title=$('#dTitle').value.trim(),text=$('#dText').value.trim();if(!title||!text)return toast('Pon un título y un texto');
    if(ui.editId){const d=state.dictados.find(x=>x.id===ui.editId);d.title=title;d.text=text;}else state.dictados.unshift({id:'d'+Date.now(),title,text});
    save();const nid=ui.editId||state.dictados[0].id;ui.editId=null;render();toast('Dictado guardado');if(Voz.ready())genVoiceFor(nid,false);},
  delDict(b){if(confirm('¿Borrar este dictado?')){state.dictados=state.dictados.filter(d=>d.id!==b.dataset.id);save();render();}},
  addRule(){state.customRules.push({word:'',rule:''});save();render();},
  delRule(b){state.customRules.splice(+b.dataset.i,1);save();render();},
  clearHist(){if(confirm('¿Borrar todo el historial en todos los dispositivos?')){state.history=[];state.sync.hclear=Date.now();save();render();}},
  syncNow(){Cloud.sync(true);},
  changePin(){const p=prompt('Nuevo PIN (4 a 8 números):');if(p===null)return;if(!/^\d{4,8}$/.test(p))return toast('PIN no válido');state.pin=p;save();toast('PIN cambiado');},
  testVoice(){Dict.test(state.settings);},
  async genVoice(b){const id=b.dataset.id;await genVoiceFor(id,true);},
  async testAI(){
    Voz.unlock();toast('Generando muestra…');
    try{const blob=await Voz.gen('Hola Julia. Título. Un día de lluvia. Ayer por la tarde llovió mucho en Madrid, coma, y volvimos a casa, punto.');Voz.playUrl(URL.createObjectURL(blob),state.ai.speed,()=>{},()=>toast('No se pudo reproducir'));}
    catch(e){toast(e.message);}
  },
  export(){const a=document.createElement('a');const cp=JSON.parse(JSON.stringify(state));cp.ai.key='';a.href=URL.createObjectURL(new Blob([JSON.stringify(cp,null,1)],{type:'application/json'}));a.download='deberes-julia-copia.json';document.body.appendChild(a);a.click();a.remove();},
  noteSave(){
    const ta=$('#noteNewTa');const text=(ta&&ta.value||'').trim();if(!text)return toast('Escribe algo antes de guardar');
    state.notas=state.notas||[];state.notas.push({id:'n'+uid(),text,date:new Date().toISOString()});
    save();render();toast('Nota guardada');
  },
  noteDel(b){
    if(!confirm('¿Borrar esta nota?'))return;
    state.notas=(state.notas||[]).filter(n=>n.id!==b.dataset.id);
    save();render();
  }
};
/* ================= eventos ================= */
const studentActions={
  goHome(){if(ui.role==='tutor'){ui.role='alumna';}Dict.stop();ui.item=null;ui.screen='home';render();},
  goList(){ui.screen='list';render();},
  backList(){Dict.stop();ui.screen=ui.item?'today':'list';render();},
  openDict(b){ui.item=null;ui.t0=Date.now();ui.dict=b.dataset.id;ui.answer='';ui.photo=null;ui.dictTheoryOpen=true;ui.dictRuleOpen=null;ui.screen='run';render();},
  dictRuleToggle(b){const k=b.dataset.k;ui.dictRuleOpen=ui.dictRuleOpen===k?null:k;const y=scrollY;render();scrollTo(0,y);},
  start:startDictado,
  pause(){Dict.cur&&Dict.cur.paused?Dict.resume():Dict.pause();},
  repeat(){Dict.repeat();},skip(){Dict.skip();},prev(){Dict.prev();},stop(){Dict.stop();updateRun();},
  correct:goCorrect,
  again(){ui.t0=Date.now();ui.answer='';ui.photo=null;ui.fix=null;ui.screen='run';render();},
  setRole(b){const r=b.dataset.role;if(r!==ui.role){Dict.stop();ui.unlocked=false;ui.editId=null;}ui.role=r;if(r==='alumna'&&ui.screen==='run')ui.screen='run';render();},
  showVersion(){const l=state.sync.last?new Date(state.sync.last).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'}):'nunca';toast(`Versión v${APP_VERSION} · última sincronización: ${l}`);}
};
const ALL=Object.assign({},studentActions,tutorActions,fixActions,taskActions,deberesActions,examActions,studyActions,miniActions,morfoActions,engDictActions);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ALL[b.dataset.act];if(f)f(b,e);});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='answer'){ui.answer=t.value;return;}
  if(t.id==='exans'&&ui.ex){ui.ex.ans[ui.ex.i]=t.value;return;}
  if(exInput(t)||tfInput(t))return;
  if(t.dataset.set){const k=t.dataset.set;state.settings[k]=t.type==='checkbox'?t.checked:(t.type==='range'||k==='ppause')?+t.value:t.value;save();
    if(k==='repeat'){const gb=$('#gapBox');if(gb)gb.style.display=state.settings.repeat>1?'':'none';}
    const lab=$('#v_'+k);if(lab)lab.textContent=k==='rate'?rateLabel(state.settings.rate):k==='pause'||k==='gap'?state.settings[k]+' s':k==='repeat'?state.settings.repeat+(state.settings.repeat>1?' veces':' vez'):state.settings[k];}
  if(t.dataset.ai){const k=t.dataset.ai;state.ai[k]=t.type==='checkbox'?t.checked:k==='speed'?+t.value:t.value;save();if(k==='speed'){const l=$('#v_aispeed');if(l)l.textContent=state.ai.speed+'×';}}
  if(t.dataset.set2==='miniGameEvery'){state.miniGameEvery=+t.value;save();const l=$('#v_miniGameEvery');if(l)l.textContent='cada '+state.miniGameEvery+' ejercicios';}
  if(t.dataset.cr){state.customRules[+t.dataset.i][t.dataset.cr]=t.value;save();}
});
document.addEventListener('change',e=>{const t=e.target;
  if(exInput(t)||tfInput(t))return;
  if(t.dataset.set==='voice'){state.settings.voice=t.value;save();}
  if(t.id==='photoIn'&&t.files[0]){const f=t.files[0];t.value='';handlePhoto(f);return;}
  if(t.id==='dictPhoto'&&t.files.length){readDictPhotos([...t.files]);t.value='';return;}
  if(t.id==='imp'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const s=JSON.parse(fr.result);if(!Array.isArray(s.dictados))throw 0;if(confirm('Esto reemplazará los datos actuales. ¿Continuar?')){const oldKey=state.ai.key;localStorage.setItem(KEY,JSON.stringify(s));state=loadState();if(!state.ai.key)state.ai.key=oldKey;state.sync={t:{},j:{},init:true,last:0,dirty:true,hclear:0,hj:''};save();ui.tab='dictados';render();toast('Copia restaurada');}}catch(x){toast('Archivo no válido');}};fr.readAsText(t.files[0]);}
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;
  if(t.dataset.enter==='word')fixActions.word({dataset:{i:t.dataset.i}});
  if(t.dataset.enter==='mans')taskActions.mcheck();
  if(t.dataset.enter==='opin')fixActions.origGo();
  if(t.dataset.enter==='pin')tutorActions.pinEnter();
  if(t.dataset.enter==='studyAns')studyActions.studyCheck();
  if(t.dataset.enter==='dictWord')engDictActions.dictSearch();
  if(t.dataset.enter==='dictGuess')engDictActions.dictReveal();});
render();
async function readDictPhotos(files){
  const st=$('#dictPhotoSt');if(!state.ai.photoOn){if(st)st.textContent='';return toast('Activa la IA de fotos en Ajustes para leer fotos');}
  const ta=$('#dText'),ti=$('#dTitle');if(!ta)return;
  files=files.slice(0,4);let out=[],title='';
  try{
    for(let i=0;i<files.length;i++){
      if(st)st.innerHTML=`🔎 Leyendo la foto ${i+1} de ${files.length}… unos segundos`;
      const r=await readPrinted(await fileToJpeg(files[i]));if(!title)title=r.title;out.push(r.text);
    }
    const txt=out.join('\n\n');
    if(ta.value.trim()&&!confirm('Ya hay un texto escrito. ¿Quieres sustituirlo por el de la foto?')){if(st)st.textContent='';return;}
    ta.value=txt;if(ti&&!ti.value.trim()&&title)ti.value=title;
    if(st)st.innerHTML='✅ <b>Texto leído.</b> Revísalo con calma: la IA puede equivocarse en alguna letra o signo. Corrígelo aquí mismo y pulsa Guardar.'+(/\[\?\]/.test(txt)?' <span class="wrong">Hay partes ilegibles marcadas con [?]: escríbelas tú.</span>':'');
  }catch(e){if(st)st.textContent='';toast(e.message);}
}
